<!DOCTYPE html>
<html>
<body style="font-family: -apple-system, sans-serif; padding: 20px;">
<h2>Git Dashboard 설치에 오신 것을 환영합니다</h2>
<p>Git Dashboard는 macOS용 Git 워크플로우 GUI 도구입니다.</p>
<ul>
  <li>브랜치 상태 실시간 시각화</li>
  <li>원클릭 develop 동기화</li>
  <li>PR 품질 체크 (컨벤션·파일 수·TODO)</li>
  <li>Release / Hotfix 브랜치 워크플로우</li>
  <li>메뉴바 상주 (시스템 트레이)</li>
</ul>
<p>설치 후 <b>/Applications/Git Dashboard.app</b>에서 실행하세요.</p>
</body>
</html>
